spring.application.name=backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/patchlens
spring.datasource.username=patchlens
spring.datasource.password=patchlens
# Let Hibernate auto-create/update tables based on entity definitions
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# GitHub (optional: increases rate limit from 60 to 5000 requests/hour)
github.token=

# OpenAI
openai.api-key=
openai.model=gpt-4o-mini
# Recorded on every evaluation run (see EvaluationService.inferenceConfig)
openai.temperature=0.1
openai.max-tokens=4000
# Hard per-request model timeout and bounded retries for transient errors (429/5xx/timeouts)
openai.timeout-seconds=60
openai.max-retries=2
github.timeout-seconds=30

# AI mode: "mock" (no API calls) or "openai" (real API calls)
ai.mode=mock

# Prompt versioning — bump version_tag when the system prompt or model changes
prompt.version=v1
prompt.notes=Initial version with gpt-4o-mini

# Cost controls
max.changed.files=20
max.patch.chars.per.file=4000

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=patchlens
spring.rabbitmq.password=patchlens

# GitHub Webhook
github.webhook.secret=

# SSE: disable MVC global async timeout; rely on SseEmitter timeout (300s)
spring.mvc.async.request-timeout=-1

# Patch validation sandbox (Docker). PR code is untrusted: builds/tests run with --network none,
# non-root, read-only rootfs, CPU/memory/PID limits and a hard timeout. If Docker is unavailable,
# patches are recorded as NOT_VALIDATED (never VALIDATED).
patchlens.sandbox.enabled=${SANDBOX_ENABLED:true}
patchlens.sandbox.image=maven:3.9.9-eclipse-temurin-21
patchlens.sandbox.cpus=1.0
patchlens.sandbox.memory=1g
patchlens.sandbox.pids-limit=256
patchlens.sandbox.max-concurrent=2
patchlens.sandbox.max-step-seconds=900

# Offline evaluation dataset (src/main/resources/eval/<dir>)
patchlens.eval.dataset=dataset-v2

# Worker concurrency (each consumer may run model calls and Docker builds) and delivery attempts
patchlens.worker.concurrency=2
patchlens.worker.max-concurrency=4
patchlens.worker.max-attempts=3
patchlens.worker.lease-seconds=120

# Large-PR limits
review.batch-char-budget=32000
review.max-batches=3

# Observability (no secrets in tags; health details only when authorized)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never
